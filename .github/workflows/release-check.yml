name: Release check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release layout
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f docs/PATCH_NOTES_zh.md
          test -f docs/RELEASE_NOTES_r37.md
          test -f docs/screenshots/desktop.webp
          test -f docs/screenshots/mobile.webp
          grep -q "v10.32.21-r37" README.md
          grep -q "v10.32.21-r37" CHANGELOG.md
      - name: Verify recorded asset checksum
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "6B68955BE50D5B2E9CB2FE13E2E8293FB85C4FD207C3FE20AEDCC6C94A25DDC7" docs/RELEASE_NOTES_r37.md
